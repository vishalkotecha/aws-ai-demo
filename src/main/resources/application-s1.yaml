spring:

  ai:
    model:
      chat: bedrock-converse
    bedrock:
      aws:
        region: us-east-1
      converse:
        chat:
          options:
            model: amazon.nova-pro-v1:0
    mcp:
      client:
        enabled: true
        streamable-http:
          connections:
            campaigns:
              url: http://localhost:8083/mcp

logging:
  level:
    org.springframework.ai.mcp: DEBUG